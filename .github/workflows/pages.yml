name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx vitest run

      - name: Build demo site
        run: npm run build
        env:
          BASE_PATH: /lumicells/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      # Tells the search engines that take IndexNow (Bing, Yandex and others) that the pages of
      # public/sitemap.xml changed. The key file (public/<key>.txt) is not at the host root, so
      # keyLocation names it. A failed ping never fails the deployment.
      - name: Notify search engines (IndexNow)
        continue-on-error: true
        env:
          KEY: 7a24820034906255d0e6f20275a37491
          SITE: https://supsad.github.io/lumicells/
        run: >-
          curl -sS --fail-with-body -X POST https://api.indexnow.org/indexnow
          -H 'Content-Type: application/json; charset=utf-8'
          --data "{\"host\":\"supsad.github.io\",\"key\":\"$KEY\",\"keyLocation\":\"${SITE}${KEY}.txt\",
          \"urlList\":[\"${SITE}\",\"${SITE}examples/web-component.html\",\"${SITE}examples/core-basic.html\"]}"
