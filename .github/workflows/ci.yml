name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (biome)
        run: npx biome check .

      - name: Unit tests
        run: npx vitest run

      - name: Build library
        id: build-lib
        run: npm run build:lib

      - name: Check published types
        run: npm run check:types

      - name: Build demo site
        run: npx vite build

      # Consumer bundle sizes of the built library against their gzip budgets (scripts/size.mjs).
      # Last, so a budget overrun never hides a broken demo build; it still runs when an earlier
      # check failed, as long as the library itself was built.
      - name: Bundle size
        if: ${{ !cancelled() && steps.build-lib.outcome == 'success' }}
        run: npm run size -- --json dist/size-report.json

      - name: Upload bundle size report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: size-report
          path: dist/size-report.json
          if-no-files-found: ignore

  # Browser end-to-end tests (playwright.config.ts), one job per browser engine (the Playwright
  # projects). The runner has no GPU: Chromium renders WebGL with SwiftShader, Firefox and WebKit
  # with Mesa's llvmpipe (software OpenGL). The browsers run headless inside Xvfb, as Playwright's
  # own CI runs them (its WebGL2 tests pass there for all three engines on Linux). Invariants fail
  # hard, timings only on gross regressions; a browser without WebGL2 fails every test at once
  # with the reason (the `webgl2` fixture in tests/e2e/support/test.ts): a run never passes on
  # posters alone.
  e2e:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      # Mesa's EGL/GLX and DRI drivers (llvmpipe) for Firefox and WebKit; Chromium brings its
      # own software rasterizer. Xvfb (installed with the browser) pulls in part of them already.
      - name: Install software OpenGL
        if: ${{ matrix.browser != 'chromium' }}
        run: >-
          sudo apt-get install -y --no-install-recommends
          libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 libgles2 libgbm1

      - name: End-to-end tests
        run: >-
          xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24"
          npm run test:e2e -- --project=${{ matrix.browser }}
        env:
          LC_E2E_GPU: swiftshader

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/e2e/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-timings-${{ matrix.browser }}
          path: |
            test-results/e2e-perf.json
            test-results/e2e-results.json
          retention-days: 30
          if-no-files-found: ignore
