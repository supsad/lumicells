<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LumiCells — stress bench</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23050632'/%3E%3Crect x='6' y='6' width='8' height='8' rx='2' fill='%23f21239'/%3E%3Crect x='18' y='6' width='8' height='8' rx='2' fill='%23c43db2'/%3E%3Crect x='6' y='18' width='8' height='8' rx='2' fill='%23e0267a'/%3E%3Crect x='18' y='18' width='8' height='8' rx='2' fill='%230476ff'/%3E%3C/svg%3E"
    />
    <!--
      Dev-only stress bench (not part of the production build). URL parameters:
        n=100                        number of backgrounds
        layout=visible|scroll        visible: all cards on one screen; scroll: a long feed
        mode=lumicells|shared|mirror lumicells: one LumiCells (one WebGL context) per card;
                                     shared: one WebGL canvas with a simple shader, copied into
                                     every card's 2D canvas with drawImage;
                                     mirror: one real LumiCells instance copied the same way
        preset=reference             LumiCells preset (lumicells / mirror)
        pauseOffscreen=1             pause offscreen cards (0 keeps them running)
        hud=0                        hide the status line
      window.bench exposes measure(ms), snapshot() and scrollThrough() for automated runs.
    -->
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
      }
      html,
      body {
        margin: 0;
        background: #000032;
        color: #cfe0ff;
      }
      body.visible {
        height: 100vh;
        overflow: hidden;
      }
      #grid {
        display: grid;
        gap: 8px;
        padding: 8px;
        justify-content: center;
      }
      body.visible #grid {
        grid-template-columns: repeat(10, 130px);
        grid-auto-rows: 80px;
      }
      body.scroll #grid {
        grid-template-columns: repeat(2, 320px);
        grid-auto-rows: 200px;
        gap: 16px;
        padding: 16px;
      }
      .card {
        position: relative;
        border-radius: 10px;
        overflow: hidden;
        background: #050632;
      }
      .card > canvas.mirror {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .card > b {
        position: absolute;
        left: 6px;
        top: 4px;
        z-index: 1;
        font: 600 11px/1 ui-monospace, Consolas, monospace;
        color: rgba(255, 255, 255, 0.75);
        pointer-events: none;
      }
      /* The mirror source must stay in the document (its IntersectionObserver must see it) but
         never be seen: it is only copied into the cards. */
      #mirror-source {
        position: fixed;
        left: 0;
        top: 0;
        width: 320px;
        height: 200px;
        opacity: 0;
        pointer-events: none;
        z-index: -1;
      }
      #hud {
        position: fixed;
        right: 8px;
        bottom: 8px;
        z-index: 10;
        padding: 6px 8px;
        border-radius: 6px;
        background: rgba(4, 8, 40, 0.85);
        font: 11px/1.4 ui-monospace, Consolas, monospace;
        white-space: pre;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="grid"></div>
    <div id="hud" hidden></div>
    <script type="module" src="./stress/main.ts"></script>
  </body>
</html>
