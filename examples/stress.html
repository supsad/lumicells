<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LumiCells — stress bench</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23050632'/%3E%3Crect x='6' y='6' width='8' height='8' rx='2' fill='%23f21239'/%3E%3Crect x='18' y='6' width='8' height='8' rx='2' fill='%23c43db2'/%3E%3Crect x='6' y='18' width='8' height='8' rx='2' fill='%23e0267a'/%3E%3Crect x='18' y='18' width='8' height='8' rx='2' fill='%230476ff'/%3E%3C/svg%3E"
    />
    <!--
      Dev-only stress bench (not part of the production build). URL parameters:
        n=100                        number of backgrounds
        layout=visible|scroll|large  visible: all cards on one screen; scroll: a long feed;
                                     large: 720x720 cards (each over 0.5 Mpx: 'auto' gives them
                                     contexts of their own while the budget has room)
        mode=lumicells|shared|mirror lumicells: one LumiCells instance per card;
                                     shared: one WebGL canvas with a simple shader, copied into
                                     every card's 2D canvas with drawImage;
                                     mirror: one real LumiCells instance copied the same way
        renderer=auto|own|shared     (lumicells) the instances' renderer (default: the
                                     library's, 'auto'): own = one WebGL context each (within the
                                     context budget), shared = the library's shared renderer (one
                                     context, atlas + 2D copies), auto = own for large ones while
                                     the budget has room, shared for the rest
        own=N                        (lumicells) the first N cards use 'own': a mixed page
        hero=1                       (lumicells) a full-viewport background (priority high)
                                     behind the cards; window.bench.resizeHero() resizes it
        promoteArea=N                LumiCells.configure() 'auto' threshold, megapixels
        sharedBudget=auto|N          LumiCells.configure() shared atlas budget, megapixels
        secondaryMaxFps=auto|N       LumiCells.configure() frame-rate cap of inactive shared
                                     instances (0 = off)
        lite=auto|on|off             LumiCells.configure() lite pipeline of shared instances
        card=WxH                     (layout=visible) card size in CSS px (default 130x80)
        slowGpu=K                    simulated slow GPU: K ms of GPU work per megapixel drawn
                                     (a GPU hog plus the instances' GPU timers, see slow-gpu.ts)
        jank=MS                      busy wait of MS on the main thread every frame
        timerShare=F                 share of the simulated GPU time their GPU timers report
        noTimer=1                    hide the GPU timer extension from the instances
        preset=reference             LumiCells preset (lumicells / mirror)
        pauseOffscreen=1             pause offscreen cards (0 keeps them running)
        maxContexts=auto|N           LumiCells.configure() context budget (library default: auto)
        parkAfterMs=N                LumiCells.configure() parking delay
        createPerFrame=N             LumiCells.configure() engine creations per frame
        mountDelay=0                 ms before the instances are created (to attach a profiler)
        look=own|shared              (lumicells) the cards' look: shared = cards that draw the
                                     same picture share one (rendered once, a crop per card)
        lookOffset=F                 (look=shared) seeded window shift, share of the card size
        interactive=1                pointer light, hover lifts and click ripples on every card
                                     (a hovered look=shared card leaves its group)
        pitch=N                      grid.sizing 'pitch' at N CSS px (crops keep the cell size)
        freeze=1                     no animation, no random lifts (pixel comparisons)
        hud=0                        hide the status line
      The instances are created in a task of their own after the first paint.
      window.bench exposes measure(ms), snapshot(), scrollThrough(), mount(), lossTest(),
      resizeHero(), rendererEvents, configure(), setConfigAll(), capture(), diff(), image(),
      hover(), record() and lookParity() for automated runs.
    -->
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
      }
      html,
      body {
        margin: 0;
        background: #000032;
        color: #cfe0ff;
      }
      body.visible {
        height: 100vh;
        overflow: hidden;
      }
      #grid {
        /* Above the hero. */
        position: relative;
        z-index: 1;
        display: grid;
        gap: 8px;
        padding: 8px;
        justify-content: center;
      }
      body.visible #grid {
        grid-template-columns: repeat(var(--cols, 10), var(--card-w, 130px));
        grid-auto-rows: var(--card-h, 80px);
      }
      body.scroll #grid {
        grid-template-columns: repeat(2, 320px);
        grid-auto-rows: 200px;
        gap: 16px;
        padding: 16px;
      }
      body.large #grid {
        grid-template-columns: repeat(2, 720px);
        grid-auto-rows: 720px;
        gap: 16px;
        padding: 16px;
      }
      /* The hero sits behind the cards, full viewport unless resized (bench.resizeHero). */
      #hero {
        position: fixed;
        left: 0;
        top: 0;
        width: 100vw;
        height: 100vh;
        z-index: 0;
        background: #050632;
      }
      .card {
        position: relative;
        border-radius: 10px;
        overflow: hidden;
        background: #050632;
      }
      .card > canvas.mirror {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .card > b {
        position: absolute;
        left: 6px;
        top: 4px;
        z-index: 1;
        font: 600 11px/1 ui-monospace, Consolas, monospace;
        color: rgba(255, 255, 255, 0.75);
        pointer-events: none;
      }
      /* The mirror source must stay in the document (its IntersectionObserver must see it) but
         never be seen: it is only copied into the cards. */
      #mirror-source {
        position: fixed;
        left: 0;
        top: 0;
        width: 320px;
        height: 200px;
        opacity: 0;
        pointer-events: none;
        z-index: -1;
      }
      #hud {
        position: fixed;
        right: 8px;
        bottom: 8px;
        z-index: 10;
        padding: 6px 8px;
        border-radius: 6px;
        background: rgba(4, 8, 40, 0.85);
        font: 11px/1.4 ui-monospace, Consolas, monospace;
        white-space: pre;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="hero" hidden></div>
    <div id="grid"></div>
    <div id="hud" hidden></div>
    <script type="module" src="./stress/main.ts"></script>
  </body>
</html>
