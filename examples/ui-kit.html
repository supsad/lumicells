<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LumiCells — UI kit</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23050632'/%3E%3Crect x='6' y='6' width='8' height='8' rx='2' fill='%23f21239'/%3E%3Crect x='18' y='6' width='8' height='8' rx='2' fill='%23c43db2'/%3E%3Crect x='6' y='18' width='8' height='8' rx='2' fill='%23e0267a'/%3E%3Crect x='18' y='18' width='8' height='8' rx='2' fill='%230476ff'/%3E%3C/svg%3E"
    />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #000032;
        color: #eceeff;
        font: 13px/1.45 Inter, ui-sans-serif, system-ui, 'Segoe UI', sans-serif;
      }
      body {
        /* Stand-in for the neon canvas behind the panel: lets the glass effect be judged. */
        background:
          radial-gradient(60vmax 50vmax at 8% 30%, rgba(106, 31, 110, 0.75), transparent 60%),
          radial-gradient(45vmax 40vmax at 12% 105%, rgba(22, 32, 126, 0.9), transparent 60%),
          radial-gradient(40vmax 40vmax at 70% 45%, rgba(4, 118, 255, 0.28), transparent 65%),
          repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.035) 0 8px, transparent 8px 11px),
          repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.035) 0 8px, transparent 8px 11px),
          #000032;
        background-attachment: fixed;
      }
      .pv-stage {
        display: flex;
        min-height: 100vh;
      }
      .pv-main {
        flex: 1 1 auto;
        min-width: 0;
        padding: 20px 24px 40px;
      }
      .pv-head h1 {
        margin: 0 0 4px;
        font-size: 20px;
      }
      .pv-head p {
        margin: 0 0 18px;
        color: #a3a8dc;
      }
      .pv-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(360px, 100%), 1fr));
        gap: 14px;
        align-items: start;
      }
      .pv-card {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 12px;
        border-radius: 12px;
        border: 1px solid rgba(150, 160, 255, 0.16);
        background: rgba(9, 11, 48, 0.55);
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
      }
      .pv-card h3 {
        margin: 0;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #8a90cc;
      }
      .pv-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
      }
      .pv-inline {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        color: #b0b5e6;
      }
      .pv-stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .pv-well {
        margin: 0 -12px;
      }
      .pv-dock {
        position: sticky;
        top: 0;
        align-self: flex-start;
        flex: none;
        box-sizing: border-box;
        height: 100vh;
        padding: 12px;
      }
      .pv-foot {
        display: flex;
        justify-content: space-between;
      }
      .pv-header-switch {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 4px 10px 4px 12px;
        color: #b0b5e6;
      }
      @media (max-width: 860px) {
        .pv-stage {
          flex-direction: column;
        }
        .pv-dock {
          position: static;
          height: 80vh;
          padding: 0 12px 12px;
        }
        .pv-dock .lcui-panel {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="../demo/stand/ui/preview.tsx"></script>
  </body>
</html>
