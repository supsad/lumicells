<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pixel-life: стенд движка</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000032;
        overflow: hidden;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
      }
      #hud {
        position: fixed;
        left: 8px;
        top: 8px;
        z-index: 1;
        font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: #e4d6f6;
        background: rgb(0 0 30 / 0.55);
        padding: 6px 8px;
        border-radius: 6px;
        white-space: pre;
        pointer-events: none;
      }
      #hud.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="hud"></div>
    <script type="module" src="./engine-harness/main.ts"></script>
  </body>
</html>
